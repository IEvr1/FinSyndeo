<!doctype html><html lang="en"><head><script src="../../embed-init.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSyndeo · Provider suitability</title><link rel="stylesheet" href="provider-apply.css"><link rel="stylesheet" href="../../embed.css"></head><body><header><div><div class="brand">FinSyndeo</div><div class="byline">Powered by SOPHIMA</div></div></header><main><h1>Your potential providers</h1><p class="lead">Compare capabilities and suitability. SOPHIMA coordinates introductions.</p><div id="content"></div><p class="preview">Anonymous comparison design preview. No live match or fit ratio has been calculated.</p></main><script>
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d;try{d=JSON.parse(localStorage.getItem('finsyndeo-whole-review-provider-draft-v1')||'null')}catch(e){}const titles={bank:'Business banking',merchant:'Merchant acquiring',private:'Private banking',finance:'Financing',correspondent:'Correspondent / payment accounts'};
function redact(v){let s=String(v||'');const names=[d.core.legalName,d.core.brand,d.core.group,d.core.website,d.core.contactName,d.core.contactEmail,...(d.licenses||[]).map(l=>l.data.holder)].filter(v=>v&&v.length>1).sort((a,b)=>b.length-a.length);for(const name of names)s=s.split(new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi')).join('[institution]');return s.replace(/https?:\/\/\S+|\b[^\s@]+@[^\s@]+\.[^\s@]+\b/g,'[private]');}
if(!d?.offers?.length)document.getElementById('content').textContent='No provider profile is available for this design preview.';else document.getElementById('content').innerHTML=d.offers.map((o,i)=>'<section class="panel"><div class="eyebrow">Provider 01 · Product '+String(i+1).padStart(2,'0')+'</div><h2>'+esc(titles[o.family])+'</h2><div class="notice">Fit ratio: calculated from your assessment in the live matching service.</div><h3>Capabilities</h3><p>'+esc((o.data.services||[]).join(' · ')||'Not yet confirmed')+'</p><h3>Currencies</h3><p>'+esc((o.data.currencies||[]).join(', ')||'Not yet confirmed')+'</p><h3>Benefits</h3><p>'+esc(redact(o.data.productBenefits||d.core.benefits)||'Not yet confirmed')+'</p><p class="hint">Pricing is determined following risk assessment and agreed between the provider and introducer.</p></section>').join('');
</script><script src="../../embed-bridge.js"></script></body></html>
