<!doctype html><html lang="en"><head><script src="../../embed-init.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOPHIMA · Provider availability</title><link rel="stylesheet" href="provider-apply.css"><link rel="stylesheet" href="../../embed.css"></head><body><header><div><div class="brand">SOPHIMA</div><div class="byline">Internal provider management</div></div><nav><a href="Institution-apply.html">Provider profile draft</a><a href="Provider-prospect-preview.html">Anonymous prospect view</a></nav></header><main><h1>Provider availability</h1><p class="lead">SOPHIMA controls whether a product can enter current matching results.</p><div id="content"></div><p class="preview">Internal design preview, using the local provider draft. This page is not an authenticated administration service.</p></main><script>
const key='finsyndeo-whole-review-provider-draft-v1',esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d;try{d=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!d?.offers?.length)document.getElementById('content').textContent='Complete at least one product in the provider draft first.';else{d.admin??={availability:{}};d.admin.availability??={};document.getElementById('content').innerHTML='<section class="panel"><h2>'+esc(d.core.legalName||'Provider draft')+'</h2><p class="hint">A signed referral agreement and regulatory checks must be verified before activation.</p>'+d.offers.map(o=>'<label class="field"><span>'+esc(o.data.name||o.family)+'</span><select data-id="'+esc(o.id)+'">'+['Pending SOPHIMA review','Available','Paused','Planned / not yet available','Withdrawn'].map(v=>'<option '+(d.admin.availability[o.id]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</section>';document.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{d.admin.availability[e.dataset.id]=e.value;localStorage.setItem(key,JSON.stringify(d));});}
</script><script src="../../embed-bridge.js"></script></body></html>
