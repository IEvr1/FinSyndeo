<!doctype html><html lang="en"><head><script src="../../embed-init.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSyndeo · Sign in</title><link rel="stylesheet" href="provider-apply.css"><link rel="stylesheet" href="../../embed.css"></head><body><header><div><div class="brand">FinSyndeo</div><div class="byline">Powered by SOPHIMA</div></div></header><main style="max-width:800px"><h1>Sign in to FinSyndeo</h1><p class="lead">Choose how you use FinSyndeo.</p><section class="panel"><div class="checks"><label class="service-card"><input type="radio" name="role" value="applicant" checked><span><b>I am looking for a provider</b><small>Bank accounts, private banking, merchant accounts, financing and correspondent facilities.</small></span></label><label class="service-card"><input type="radio" name="role" value="provider"><span><b>I am a financial institution</b><small>I offer facilities and want to be included in your list of providers.</small></span></label></div><form id="login"><label class="field"><span>Email address</span><input id="email" type="email" required autocomplete="email"></label><button class="primary" type="submit">Send secure sign-in link</button><p id="message" role="status" hidden></p><button id="preview" type="button" hidden>Continue to account preview</button></form></section><p class="preview">Interactive design preview. No authentication or email delivery is connected. Continue to account preview demonstrates the saved-account journey in this browser.</p></main><script>
const params=new URLSearchParams(location.search),role=params.get('role');if(['provider','applicant'].includes(role))document.querySelector('[name=role][value='+role+']').checked=true;document.getElementById('login').onsubmit=e=>{e.preventDefault();document.getElementById('message').hidden=false;document.getElementById('message').textContent='Preview only: no email has been sent. The live service will verify your identity through a secure sign-in link.';document.getElementById('preview').hidden=false;};document.getElementById('preview').onclick=()=>{if(!document.getElementById('email').reportValidity())return;const selected=document.querySelector('[name=role]:checked').value;const address=document.getElementById('email').value.trim().toLowerCase();sessionStorage.setItem('finsyndeo-whole-review-preview-session',JSON.stringify({role:selected,email:address}));if(selected==='applicant'){const previous=localStorage.getItem('finsyndeo-whole-review-applicant-preview-owner');if(previous&&previous!==address){localStorage.removeItem('finsyndeo-whole-review-unified-draft-v1');sessionStorage.removeItem('finsyndeo-whole-review-active-assessment');}localStorage.setItem('finsyndeo-whole-review-applicant-preview-owner',address);}if(selected==='provider'){const account=JSON.parse(localStorage.getItem('finsyndeo-whole-review-preview-account-'+encodeURIComponent(address))||'null'),owner=localStorage.getItem('finsyndeo-whole-review-provider-preview-owner');if(account?.provider){const current=JSON.parse(localStorage.getItem('finsyndeo-whole-review-provider-draft-v1')||'null');if(owner===address&&current?.admin)account.provider.admin=current.admin;localStorage.setItem('finsyndeo-whole-review-provider-draft-v1',JSON.stringify(account.provider));}else if(owner&&owner!==address)localStorage.removeItem('finsyndeo-whole-review-provider-draft-v1');localStorage.setItem('finsyndeo-whole-review-provider-preview-owner',address);}const next=params.get('next'),allowed=selected==='applicant'?['FinSyndeo-review.html']:['Institution-apply.html'];location.href=allowed.includes(next)?next:'My-account.html';};
</script><script src="../../embed-bridge.js"></script></body></html>
