<!doctype html><html lang="en"><head><script src="../../embed-init.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSyndeo · My account</title><link rel="stylesheet" href="provider-apply.css"><link rel="stylesheet" href="../../embed.css"></head><body><header><div><div class="brand">FinSyndeo</div><div class="byline">Powered by SOPHIMA</div></div><nav><button id="logout" type="button">Sign out</button></nav></header><main><h1 id="title">My account</h1><p id="lead" class="lead"></p><div id="content"></div><p class="preview">Account design preview. Records and alert preferences are saved locally in this browser. Cloud storage, verified authentication, live matching and notifications are not connected.</p></main><script>
let session;try{session=JSON.parse(sessionStorage.getItem('finsyndeo-whole-review-preview-session')||'null')}catch(e){}if(!session)location.replace('Sign-in.html');else{const key='finsyndeo-whole-review-preview-account-'+encodeURIComponent(session.email),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let account;try{account=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}account??={assessments:[]};document.getElementById('lead').textContent=session.email;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('finsyndeo-whole-review-preview-session');sessionStorage.removeItem('finsyndeo-whole-review-active-assessment');location.href='Sign-in.html';};
function render(){if(session.role==='provider'){document.getElementById('title').textContent='My institution profile';document.getElementById('content').innerHTML='<section class="panel"><h2>Manage your provider profile</h2><p>Keep services, customer acceptance policies and supporting documents up to date. SOPHIMA manages listing approval and availability.</p><a href="Institution-apply.html">Open and update my profile</a></section>';return;}document.getElementById('title').textContent='My assessments';document.getElementById('content').innerHTML='<button id="new" type="button" class="primary">Start a new assessment</button>'+(!account.assessments.length?'<p class="notice">Your saved assessments will appear here.</p>':'')+account.assessments.map(a=>'<section class="panel"><h2>'+esc(a.name)+'</h2><p>'+esc(a.kind)+'</p><div class="presets"><button data-edit="'+a.id+'">Edit assessment</button><button data-review="'+a.id+'">Review and refresh matches</button></div><label class="checkline"><input type="checkbox" data-alert="'+a.id+'" '+(a.notifications.enabled?'checked':'')+'>Notify me when a newly added provider meets my requirements.</label><label class="field" style="margin-top:14px"><span>Minimum fit for notifications</span><select data-threshold="'+a.id+'">'+[100,95,90,85,80,75,70].map(n=>'<option value="'+n+'" '+(a.notifications.threshold===n?'selected':'')+'>At least '+n+'%</option>').join('')+'</select></label><p class="hint">All essential eligibility requirements must be met, regardless of fit percentage. You can switch notifications off at any time. Preview only: no notifications are sent.</p></section>').join('');document.getElementById('new').onclick=()=>{sessionStorage.removeItem('finsyndeo-whole-review-active-assessment');localStorage.removeItem('finsyndeo-whole-review-unified-draft-v1');location.href='FinSyndeo-review.html';};document.querySelectorAll('[data-edit],[data-review]').forEach(b=>b.onclick=()=>{const a=account.assessments.find(a=>a.id===(b.dataset.edit||b.dataset.review)),draft=structuredClone(a.draft);draft.page=b.dataset.review?40:1;localStorage.setItem('finsyndeo-whole-review-unified-draft-v1',JSON.stringify(draft));sessionStorage.setItem('finsyndeo-whole-review-active-assessment',a.id);location.href='FinSyndeo-review.html';});document.querySelectorAll('[data-alert],[data-threshold]').forEach(e=>e.onchange=()=>{const a=account.assessments.find(a=>a.id===(e.dataset.alert||e.dataset.threshold));if(e.dataset.alert)a.notifications.enabled=e.checked;else a.notifications.threshold=Number(e.value);localStorage.setItem(key,JSON.stringify(account));});}render();}
</script><script src="../../embed-bridge.js"></script></body></html>
